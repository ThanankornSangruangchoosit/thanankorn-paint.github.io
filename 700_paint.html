<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Studio</title>
    <style>
        :root {
            --bg: #f3f6fb;
            --panel: #ffffff;
            --border: #dce4ee;
            --text: #233042;
            --accent: #4f7cff;
            --accent-light: #eef4ff;
            --shadow: 0 16px 40px rgba(35, 48, 66, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f7faff 0%, var(--bg) 100%);
            color: var(--text);
        }
        .app-shell {
            max-width: 1200px;
            margin: 24px auto;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px 16px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
        }
        .header .hint {
            color: #6a7690;
            font-size: 0.95rem;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            margin-bottom: 14px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar .tool-group:last-child {
            margin-left: auto;
        }
        .tool-btn, .toolbar input[type="range"], .toolbar input[type="color"], .toolbar button {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            color: var(--text);
            padding: 8px 10px;
            cursor: pointer;
            transition: 0.15s ease;
            font-size: 1rem;
            font-weight: 700;
        }
        .toolbar label,
        .toolbar span {
            font-size: 1rem;
            font-weight: 700;
        }
        .tool-btn:hover, .toolbar input:hover, .toolbar button:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .tool-btn.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }
        .toolbar .divider {
            width: 1px;
            height: 38px;
            background: var(--border);
            margin: 0 8px;
        }
        .canvas-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 16px;
        }
        .canvas-frame {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #f9fbff;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: min(100%, 760px);
            height: auto;
            border-radius: 14px;
            border: 1px solid #dfe7f2;
            background: #ffffff;
            touch-action: none;
            image-rendering: pixelated;
        }
        .footer {
            margin-top: 12px;
            color: #73809a;
            font-size: 0.9rem;
            text-align: center;
        }
        @media (max-width: 920px) {
            .app-shell {
                display: block;
            }
            .content-area {
                display: block;
            }
            .toolbar {
                margin-top: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="header">
            <div>
                <h1>Paint Studio</h1>
                <div class="hint"></div>
                <div class="hint"><strong>ชื่อ-นามสกุล:</strong> ธนัญกรณ์ แสงเรืองชุสิทธิ์</div>
                <div class="hint"><strong>รหัสนิสิต:</strong> 6721601231</div>
                <div class="hint"><strong>หมู่:</strong> 700</div>
                <div class="hint"><strong>สถานศึกษา:</strong> มหาวิทยาลัยเกษรศาสตร์ กำแพงแสน</div>
                <div class="hint"><strong>คณะ:</strong> ศิลปศาสตร์และวิทยาศาสตร์ สาขาวิทยาการคอมพิวเตอร์ ปี 3</div>
            </div>
        </div>

        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" id="penBtn" title="Pen">✏️</button>
                <button class="tool-btn" id="eraserBtn" title="Eraser">🧽</button>
                <button class="tool-btn" id="lineBtn" title="Line">/</button>
                <button class="tool-btn" id="rectBtn" title="Rectangle">▭</button>
                <button class="tool-btn" id="circleBtn" title="Circle">◯</button>
                <button class="tool-btn" id="bucketBtn" title="Bucket Fill">🪣</button>
            </div>
            <div class="divider"></div>
            <div class="tool-group">
                <label for="colorPicker">Color</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <div class="tool-group" style="margin-left: auto;">
                <label for="brushSize">Size</label>
                <input type="range" id="brushSize" min="1" max="24" value="5">
                <span id="sizeValue">5</span>
                <button id="clearBtn">Clear</button>
            </div>
        </div>

        <div class="canvas-card">
            <canvas id="canvas" width="600" height="600"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false });
        let imageData = ctx.createImageData(canvas.width, canvas.height);
        let data = imageData.data;
        ctx.imageSmoothingEnabled = false;

        let drawing = false;
        let startPoint = null;
        let currentPoint = null;
        let brushSize = 5;
        let activeTool = 'pen';
        let currentColor = { r: 0, g: 0, b: 0, a: 255 };
        let snapshot = null;

        function syncImageData() {
            imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            data = imageData.data;
        }

        function clearCanvas() {
            imageData = ctx.createImageData(canvas.width, canvas.height);
            data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                data[i] = 255;
                data[i + 1] = 255;
                data[i + 2] = 255;
                data[i + 3] = 255;
            }
            render();
        }

        function render() {
            ctx.putImageData(imageData, 0, 0);
        }

        function putPixel(x, y, r, g, b, a = 255) {
            const radius = Math.max(1, Math.floor(brushSize / 2));
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    if (dx * dx + dy * dy <= radius * radius) {
                        const px = x + dx;
                        const py = y + dy;
                        if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
                            const index = (py * canvas.width + px) * 4;
                            data[index] = r;
                            data[index + 1] = g;
                            data[index + 2] = b;
                            data[index + 3] = a;
                        }
                    }
                }
            }
        }

        function drawLine(x1, y1, x2, y2, r, g, b) {
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);
            const steps = Math.max(dx, dy);
            for (let i = 0; i <= steps; i++) {
                const t = steps === 0 ? 0 : i / steps;
                const x = Math.round(x1 + (x2 - x1) * t);
                const y = Math.round(y1 + (y2 - y1) * t);
                putPixel(x, y, r, g, b);
            }
        }

        function drawRectOutline(x1, y1, x2, y2, r, g, b) {
            drawLine(x1, y1, x2, y1, r, g, b);
            drawLine(x2, y1, x2, y2, r, g, b);
            drawLine(x2, y2, x1, y2, r, g, b);
            drawLine(x1, y2, x1, y1, r, g, b);
        }

        function drawCircleOutline(cx, cy, rx, ry, r, g, b) {
            if (rx < 0.5 || ry < 0.5) return;

            const steps = Math.max(48, Math.round(Math.max(rx, ry) * 3));
            let prevX = Math.round(cx + rx);
            let prevY = Math.round(cy);

            for (let i = 1; i <= steps; i++) {
                const angle = (i / steps) * Math.PI * 2;
                const x = Math.round(cx + Math.cos(angle) * rx);
                const y = Math.round(cy + Math.sin(angle) * ry);
                drawLine(prevX, prevY, x, y, r, g, b);
                prevX = x;
                prevY = y;
            }

            drawLine(prevX, prevY, Math.round(cx + rx), Math.round(cy), r, g, b);
        }

        function drawPreview(start, end) {
            const color = activeTool === 'eraser' ? { r: 255, g: 255, b: 255 } : currentColor;
            if (activeTool === 'line') {
                drawLine(start.x, start.y, end.x, end.y, color.r, color.g, color.b);
            } else if (activeTool === 'rect') {
                drawRectOutline(start.x, start.y, end.x, end.y, color.r, color.g, color.b);
            } else if (activeTool === 'circle') {
                const cx = (start.x + end.x) / 2;
                const cy = (start.y + end.y) / 2;
                const rx = Math.abs(end.x - start.x) / 2;
                const ry = Math.abs(end.y - start.y) / 2;
                drawCircleOutline(cx, cy, rx, ry, color.r, color.g, color.b);
            }
        }

        function getPixelColor(x, y) {
            const index = (y * canvas.width + x) * 4;
            return {
                r: data[index],
                g: data[index + 1],
                b: data[index + 2],
                a: data[index + 3]
            };
        }

        function colorsMatch(a, b) {
            return a.r === b.r && a.g === b.g && a.b === b.b && a.a === b.a;
        }

        function fillArea(startX, startY) {
            syncImageData();
            const startColor = getPixelColor(startX, startY);
            const fillColor = activeTool === 'eraser'
                ? { r: 255, g: 255, b: 255, a: 255 }
                : { ...currentColor, a: 255 };

            if (colorsMatch(startColor, fillColor)) {
                return;
            }

            const queue = [[startX, startY]];
            const visited = new Uint8Array(canvas.width * canvas.height);

            while (queue.length > 0) {
                const [x, y] = queue.shift();
                const px = Math.round(x);
                const py = Math.round(y);

                if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) {
                    continue;
                }

                const index = py * canvas.width + px;
                if (visited[index]) {
                    continue;
                }

                visited[index] = 1;
                const pixel = getPixelColor(px, py);
                if (!colorsMatch(pixel, startColor)) {
                    continue;
                }

                const pixelIndex = index * 4;
                data[pixelIndex] = fillColor.r;
                data[pixelIndex + 1] = fillColor.g;
                data[pixelIndex + 2] = fillColor.b;
                data[pixelIndex + 3] = fillColor.a;

                queue.push([px - 1, py]);
                queue.push([px + 1, py]);
                queue.push([px, py - 1]);
                queue.push([px, py + 1]);
            }

            imageData = ctx.createImageData(canvas.width, canvas.height);
            imageData.data.set(data);
            render();
        }

        function getMousePos(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((event.clientX - rect.left) * scaleX);
            const y = Math.floor((event.clientY - rect.top) * scaleY);
            return {
                x: Math.min(canvas.width - 1, Math.max(0, x)),
                y: Math.min(canvas.height - 1, Math.max(0, y))
            };
        }

        function updateColor() {
            const hex = document.getElementById('colorPicker').value;
            currentColor = {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16),
                a: 255
            };
        }

        function setTool(tool) {
            activeTool = tool;
            document.getElementById('penBtn').classList.toggle('active', tool === 'pen');
            document.getElementById('eraserBtn').classList.toggle('active', tool === 'eraser');
            document.getElementById('lineBtn').classList.toggle('active', tool === 'line');
            document.getElementById('rectBtn').classList.toggle('active', tool === 'rect');
            document.getElementById('circleBtn').classList.toggle('active', tool === 'circle');
            document.getElementById('bucketBtn').classList.toggle('active', tool === 'bucket');
        }

        document.getElementById('penBtn').addEventListener('click', () => setTool('pen'));
        document.getElementById('eraserBtn').addEventListener('click', () => setTool('eraser'));
        document.getElementById('lineBtn').addEventListener('click', () => setTool('line'));
        document.getElementById('rectBtn').addEventListener('click', () => setTool('rect'));
        document.getElementById('circleBtn').addEventListener('click', () => setTool('circle'));
        document.getElementById('bucketBtn').addEventListener('click', () => setTool('bucket'));
        document.getElementById('clearBtn').addEventListener('click', clearCanvas);
        document.getElementById('colorPicker').addEventListener('input', updateColor);
        document.getElementById('brushSize').addEventListener('input', (event) => {
            brushSize = Number(event.target.value);
            document.getElementById('sizeValue').textContent = brushSize;
        });

        canvas.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            startPoint = getMousePos(event);
            currentPoint = startPoint;

            if (activeTool === 'bucket') {
                fillArea(startPoint.x, startPoint.y);
                return;
            }

            canvas.setPointerCapture(event.pointerId);
            drawing = true;
            if (activeTool === 'pen' || activeTool === 'eraser') {
                const color = activeTool === 'eraser' ? { r: 255, g: 255, b: 255 } : currentColor;
                drawLine(startPoint.x, startPoint.y, startPoint.x, startPoint.y, color.r, color.g, color.b);
            } else {
                snapshot = new Uint8ClampedArray(data);
            }
            render();
        });

        canvas.addEventListener('pointermove', (event) => {
            if (!drawing) return;
            currentPoint = getMousePos(event);
            if (activeTool === 'pen' || activeTool === 'eraser') {
                const color = activeTool === 'eraser' ? { r: 255, g: 255, b: 255 } : currentColor;
                drawLine(startPoint.x, startPoint.y, currentPoint.x, currentPoint.y, color.r, color.g, color.b);
                startPoint = currentPoint;
            } else if (snapshot) {
                data.set(snapshot);
                const color = activeTool === 'eraser' ? { r: 255, g: 255, b: 255 } : currentColor;
                if (activeTool === 'line') {
                    drawLine(startPoint.x, startPoint.y, currentPoint.x, currentPoint.y, color.r, color.g, color.b);
                } else if (activeTool === 'rect') {
                    drawRectOutline(startPoint.x, startPoint.y, currentPoint.x, currentPoint.y, color.r, color.g, color.b);
                } else if (activeTool === 'circle') {
                    const cx = (startPoint.x + currentPoint.x) / 2;
                    const cy = (startPoint.y + currentPoint.y) / 2;
                    const rx = Math.abs(currentPoint.x - startPoint.x) / 2;
                    const ry = Math.abs(currentPoint.y - startPoint.y) / 2;
                    drawCircleOutline(cx, cy, rx, ry, color.r, color.g, color.b);
                }
            }
            render();
        });

        canvas.addEventListener('pointerup', (event) => {
            drawing = false;
            snapshot = null;
            if (canvas.hasPointerCapture(event.pointerId)) {
                canvas.releasePointerCapture(event.pointerId);
            }
        });

        canvas.addEventListener('pointercancel', (event) => {
            drawing = false;
            snapshot = null;
            if (canvas.hasPointerCapture(event.pointerId)) {
                canvas.releasePointerCapture(event.pointerId);
            }
        });

        updateColor();
        clearCanvas();
    </script>
</body>
</html>
